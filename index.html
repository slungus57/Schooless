<script>
/* SCHOOLess — embedded player component (spec §7 + §8.2 viewer).
 * Reusable EmbeddedPlayer: game title, source URL/website, aspect ratio,
 * permissions, fullscreen, reload, external fallback.
 */
'use strict';

const Player = {
  /* Build a player for a game record { title, playUrl, sourceUrl, source, permissions, aspect, status } */
  gamePlayer(g) {
    const src = safeUrl(g.playUrl) || safeUrl(g.sourceUrl);
    if (!src) {
      return `<div class="container">${UI.empty('alert', 'Game unavailable', 'This game has no valid HTTPS source URL.', `<a class="btn btn-primary" href="#/games">${I.arrowLeft} Back to Games</a>`)}</div>`;
    }
    const source = Content.sources.find(s => s.id === g.source) || { name: 'External', baseUrl: domainOf(src) };
    const perms = g.permissions || source.permissions || { fullscreen: true };
    const aspect = g.aspect || source.aspectRatio || '16-9';
    const stLabel = { verified: 'Verified embed', supported: 'Supported', unverified: 'Unverified', external: 'External only', unavailable: 'Unavailable' }[g.status] || 'Unverified';

    return `
    <div class="player-wrap">
      <a class="back-link" href="#/games">${I.arrowLeft} Back to Games</a>
      <div class="player-card">
        <div class="player-toolbar">
          <div class="pt-info">
            <img src="${esc(faviconUrl(domainOf(src)))}" alt="" width="14" height="14" loading="lazy" data-fallback="favicon" data-fallback-src="${esc(faviconFallback(domainOf(src)))}" data-letter="S" style="border-radius:3px">
            <div style="min-width:0">
              <div class="pt-title">${esc(g.title)}</div>
              <div class="pt-src">${esc(source.name)} · <span class="st-dot st-${esc(g.status || 'unverified')}"></span> ${stLabel}</div>
            </div>
          </div>
          <div class="pt-actions">
            <button class="icon-btn" id="btnFav" title="Favorite" aria-label="Toggle favorite">${I.heart}</button>
            <span class="divider"></span>
            <button class="icon-btn" id="btnReport" title="Report broken game" aria-label="Report broken game">${I.flag}</button>
            <button class="icon-btn" id="btnReload" title="Reload game" aria-label="Reload">${I.rotate}</button>
            ${perms.fullscreen ? `<button class="icon-btn" id="btnFull" title="Fullscreen" aria-label="Fullscreen">${I.maximize}</button>` : ''}
            <a class="icon-btn" id="btnExt" href="${esc(src)}" target="_blank" rel="noopener noreferrer" title="Open externally" aria-label="Open externally">${I.external}</a>
          </div>
        </div>
        <div class="player-stage ar-${esc(aspect)}" id="playerStage">
          <div class="stage-box">
            <div class="player-loading" id="playerLoading">
              <span class="logo-spin">${I.logo.replace('viewBox="0 0 32 32"', 'viewBox="0 0 32 32" width="44" height="44"')}</span>
              <span class="t">Loading ${esc(g.title)}…</span>
            </div>
            <iframe
              id="playerFrame" class="player-frame" title="${esc(g.title)} — embedded game"
              src="${esc(src)}"
              loading="lazy" referrerpolicy="no-referrer-when-downgrade"
              allow="autoplay; fullscreen; gamepad; keyboard-map ${perms.pointerLock ? '; pointer-lock' : ''}"
              allowfullscreen
              ${g.sandbox ? `sandbox="${esc(g.sandbox)}"` : ''}></iframe>
          </div>
          <div class="player-error" id="playerError">
            <span style="color:var(--warn)">${I.alert}</span>
            <div class="pe-title">Having trouble loading this game?</div>
            <div class="pe-sub">The source may be blocked by your network, offline, or may have stopped allowing embedding.</div>
            <div class="pe-actions">
              <button class="btn btn-primary btn-sm" id="peRetry">${I.refresh} Try Again</button>
              <a class="btn btn-ghost btn-sm" href="${esc(src)}" target="_blank" rel="noopener noreferrer">${I.external} Open Original Website</a>
              <a class="btn btn-ghost btn-sm" href="#/games">${I.grid} Back to Games</a>
            </div>
          </div>
        </div>
      </div>

      <div class="player-meta">
        <div class="pm-grid">
          <div class="pm-desc">
            <h3>About this game</h3>
            <p>${esc(g.description)}</p>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px">${(g.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
          </div>
          <div>
            <h3 style="margin:0 0 10px; font-size:15px; font-weight:650">Details</h3>
            <div class="pm-facts">
              <div class="fact"><div class="k">Source</div><div class="v">${esc(source.name)}</div></div>
              <div class="fact"><div class="k">Category</div><div class="v">${esc(g.category)}</div></div>
              <div class="fact"><div class="k">Added</div><div class="v">${esc(g.dateAdded || '—')}</div></div>
              <div class="fact"><div class="k">Embed status</div><div class="v"><span class="st-dot st-${esc(g.status || 'unverified')}"></span>${stLabel}</div></div>
            </div>
          </div>
        </div>
        ${this.relatedGames(g)}
      </div>
    </div>`;
  },

  relatedGames(g) {
    const rel = Content.games
      .filter(x => x.id !== g.id && (x.category === g.category || (x.tags || []).some(t => (g.tags || []).includes(t))))
      .slice(0, 6);
    if (!rel.length) return '';
    return `
    <div style="margin-top:var(--sp-6)">
      ${UI.sectionHead('Related games', rel.length)}
      <div class="game-grid">${rel.map(x => UI.gameCard(x)).join('')}</div>
    </div>`;
  },

  /* Wire up player events after mount */
  bindGame(g) {
    const src = safeUrl(g.playUrl) || safeUrl(g.sourceUrl);
    const stage = $('#playerStage');
    const frame = $('#playerFrame');
    const loading = $('#playerLoading');
    const errBox = $('#playerError');
    if (!stage || !frame) return;

    // track recently played
    Recent.push(g.id, g.title);

    // favorite button state
    const favBtn = $('#btnFav');
    const syncFav = () => {
      const faved = Favorites.has('game', g.id);
      favBtn.classList.toggle('active', faved);
      favBtn.innerHTML = faved ? I.heart.replace('<svg', '<svg fill="currentColor"') : I.heart;
    };
    syncFav();
    favBtn.addEventListener('click', () => { Favorites.toggle('game', g.id, g.title); syncFav(); });

    // hide loading on iframe load; show fallback panel after timeout
    let loaded = false;
    const armFallback = () => {
      // cross-origin iframes fire load even when blocked; the honest signal we CAN use:
      // if load fires, assume it rendered (embeddable status is separately honest).
      // if nothing happens for 12s, offer fallback.
      return setTimeout(() => { if (!loaded) errBox.classList.add('show'); }, 12000);
    };
    let fallbackTimer = armFallback();
    frame.addEventListener('load', () => {
      loaded = true;
      clearTimeout(fallbackTimer);
      loading.classList.add('hidden');
      errBox.classList.remove('show');
    });
    frame.addEventListener('error', () => { errBox.classList.add('show'); loading.classList.add('hidden'); });

    // reload
    $('#btnReload')?.addEventListener('click', () => {
      loaded = false;
      clearTimeout(fallbackTimer);
      errBox.classList.remove('show');
      loading.classList.remove('hidden');
      frame.src = frame.src; // eslint-disable-line no-self-assign
      fallbackTimer = armFallback();
      Toast.show('info', 'Reloading', g.title);
    });
    $('#peRetry')?.addEventListener('click', () => $('#btnReload')?.click());

    // fullscreen on stage (container), so toolbar hides — use stage element
    const btnFull = $('#btnFull');
    const doFull = async () => {
      try {
        if (document.fullscreenElement) { await document.exitFullscreen(); return; }
        if (stage.requestFullscreen) await stage.requestFullscreen();
        else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
        else Toast.show('warn', 'Fullscreen unsupported', 'Your browser blocked fullscreen for this content.');
      } catch (e) {
        Toast.show('warn', 'Fullscreen blocked', 'The browser or the embedded page did not allow fullscreen.');
      }
    };
    btnFull?.addEventListener('click', doFull);

    // report broken
    $('#btnReport')?.addEventListener('click', () => {
      const reports = Store.get('reports', []);
      reports.push({ id: g.id, title: g.title, url: src, ts: Date.now() });
      Store.set('reports', reports);
      Toast.show('ok', 'Reported', `Thanks — "${g.title}" was flagged for review.`);
    });

    // keyboard: f = fullscreen, r = reload (when player page open and not typing)
    this._keyHandler = (e) => {
      if (e.target.matches('input, textarea, select')) return;
      if (e.key === 'f' || e.key === 'F') { doFull(); }
      if (e.key === 'r' || e.key === 'R') { $('#btnReload')?.click(); }
    };
    document.addEventListener('keydown', this._keyHandler);
  },

  destroy() {
    if (this._keyHandler) { document.removeEventListener('keydown', this._keyHandler); this._keyHandler = null; }
  },

  /* ============ Website viewer (spec §8.2) ============ */
  viewer(url, name) {
    const dom = domainOf(url);
    return `
    <div class="player-wrap">
      <a class="back-link" href="#/experiences">${I.arrowLeft} Back to Web Experiences</a>
      <div class="viewer-banner">${I.shield} Viewing <b style="margin:0 4px">${esc(dom)}</b> inside Schooless — allowlisted site, sandboxed viewer. <span style="margin-left:auto; white-space:nowrap">${I.keyboard} F fullscreen · R reload</span></div>
      <div class="player-card">
        <div class="player-toolbar">
          <div class="pt-info">
            <img src="${esc(faviconUrl(dom))}" alt="" width="14" height="14" loading="lazy" data-fallback="favicon" data-fallback-src="${esc(faviconFallback(dom))}" data-letter="S" style="border-radius:3px">
            <div style="min-width:0">
              <div class="pt-title">${esc(name || dom)}</div>
              <div class="pt-src">${esc(dom)} · sandboxed viewer</div>
            </div>
          </div>
          <div class="pt-actions">
            <button class="icon-btn" id="vReload" title="Reload" aria-label="Reload">${I.rotate}</button>
            <button class="icon-btn" id="vFull" title="Fullscreen" aria-label="Fullscreen">${I.maximize}</button>
            <a class="icon-btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="Open externally" aria-label="Open externally">${I.external}</a>
          </div>
        </div>
        <div class="player-stage ar-flex" id="playerStage">
          <div class="stage-box">
            <div class="player-loading" id="playerLoading"><span class="logo-spin">${I.logo.replace('viewBox="0 0 32 32"', 'viewBox="0 0 32 32" width="44" height="44"')}</span><span class="t">Loading ${esc(dom)}…</span></div>
            <iframe id="playerFrame" class="player-frame" title="${esc(name || dom)} — embedded website"
              src="${esc(url)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
              allow="autoplay; fullscreen; clipboard-write" allowfullscreen
              sandbox="allow-forms allow-modals allow-pointer-lock allow-popups allow-same-origin allow-scripts"></iframe>
          </div>
          <div class="player-error" id="playerError">
            <span style="color:var(--warn)">${I.alert}</span>
            <div class="pe-title">Having trouble loading this site?</div>
            <div class="pe-sub">It may be offline, or its owner may have disallowed embedding since our last check.</div>
            <div class="pe-actions">
              <button class="btn btn-primary btn-sm" id="peRetry">${I.refresh} Try Again</button>
              <a class="btn btn-ghost btn-sm" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${I.external} Open Original Website</a>
              <a class="btn btn-ghost btn-sm" href="#/experiences">${I.grid} Back to Web Experiences</a>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  },

  bindViewer(url) {
    const stage = $('#playerStage'), frame = $('#playerFrame');
    const loading = $('#playerLoading'), errBox = $('#playerError');
    if (!stage || !frame) return;
    let loaded = false;
    let timer = setTimeout(() => { if (!loaded) errBox.classList.add('show'); }, 12000);
    frame.addEventListener('load', () => { loaded = true; clearTimeout(timer); loading.classList.add('hidden'); errBox.classList.remove('show'); });
    const reload = () => {
      loaded = false; clearTimeout(timer);
      errBox.classList.remove('show'); loading.classList.remove('hidden');
      frame.src = frame.src; fallback = setTimeout(() => { if (!loaded) errBox.classList.add('show'); }, 12000); // eslint-disable-line
    };
    let fallback;
    $('#vReload')?.addEventListener('click', reload);
    $('#peRetry')?.addEventListener('click', reload);
    const doFull = async () => {
      try {
        if (document.fullscreenElement) { await document.exitFullscreen(); return; }
        await stage.requestFullscreen();
      } catch { Toast.show('warn', 'Fullscreen blocked', 'The browser did not allow fullscreen here.'); }
    };
    $('#vFull')?.addEventListener('click', doFull);
    this._keyHandler = (e) => {
      if (e.target.matches('input, textarea, select')) return;
      if (e.key === 'f' || e.key === 'F') doFull();
      if (e.key === 'r' || e.key === 'R') reload();
    };
    document.addEventListener('keydown', this._keyHandler);
  },
};

</script>
<script>
/* SCHOOLess — page views: Home, Games, Resources, Web Experiences,
 * Proxies, Recently Added, Favorites, Settings.
 */
'use strict';

const Pages = {

  /* ================= HOME ================= */
  home() {
    const games = Content.games;
    const featured = games.filter(g => g.featured).slice(0, 8);
    const popular = games.filter(g => g.popular).slice(0, 10);
    const recent = [...games].sort((a, b) => (b.dateAdded || '').localeCompare(a.dateAdded || '')).slice(0, 10);
    const played = Recent.items.map(r => games.find(g => g.id === r.id)).filter(Boolean).slice(0, 8);
    const featRes = Content.resources.filter(r => r.featured).slice(0, 4);
    const featExp = Content.experiences.filter(e => e.featured).slice(0, 4);
    const recentRes = [...Content.resources, ...Content.experiences]
      .sort((a, b) => (b.dateAdded || '').localeCompare(a.dateAdded || '')).slice(0, 6);

    return `
    <div class="container">
      <section class="hero">
        <h1>Your gateway to <span class="grad">everything.</span></h1>
        <p>Games, web experiences, and useful resources. All in one place.</p>
        <div class="hero-search" id="heroSearch">
          ${I.search.replace('<svg', '<svg class="lead"')}
          <input id="heroInput" type="search" placeholder="Search games, experiences, resources…" aria-label="Search Schooless" autocomplete="off">
        </div>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#/games">${I.gamepad} Browse Games</a>
          <a class="btn btn-ghost" href="#/resources">${I.book} Explore Resources</a>
        </div>
      </section>

      <section class="section">
        ${UI.sectionHead('Featured games', featured.length, '/games?filter=featured')}
        <div class="game-grid cols-feature">${featured.map(g => UI.gameCard(g)).join('')}</div>
      </section>

      <section class="section">
        ${UI.sectionHead('Popular categories', CATEGORIES.length)}
        <div class="cat-grid">
          ${CATEGORIES.map(c => {
            const n = games.filter(g => g.category === c.name).length;
            return `<a class="cat-card" href="#/games?category=${encodeURIComponent(c.name)}">
              <span class="cat-ico">${I[c.icon]}</span>
              <span><span class="n">${c.name}</span><br><span class="c">${n} game${n === 1 ? '' : 's'}</span></span>
            </a>`;
          }).join('')}
        </div>
      </section>

      ${played.length ? `
      <section class="section">
        ${UI.sectionHead('Recently played', played.length, '/recent')}
        <div class="recent-strip">${played.map(g => UI.gameCard(g)).join('')}</div>
      </section>` : ''}

      <section class="section">
        ${UI.sectionHead('Popular right now', popular.length, '/games?filter=popular')}
        <div class="game-grid">${popular.map(g => UI.gameCard(g)).join('')}</div>
      </section>

      <section class="section">
        ${UI.sectionHead('Recently added', recent.length + recentRes.length, '/recent')}
        <div class="game-grid">${recent.map(g => UI.gameCard(g)).join('')}</div>
        ${recentRes.length ? `<div class="res-grid" style="margin-top:var(--sp-4)">${recentRes.map(r => UI.resourceCard(r, r.type === 'proxy' ? 'resource' : 'resource')).join('')}</div>` : ''}
      </section>

      <section class="section">
        ${UI.sectionHead('Featured websites', featRes.length + featExp.length, '/experiences')}
        <div class="res-grid">
          ${featExp.map(e => UI.resourceCard(e, 'experience')).join('')}
          ${featRes.map(r => UI.resourceCard(r)).join('')}
        </div>
      </section>
    </div>`;
  },

  bindHome() {
    const input = $('#heroInput');
    input?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = input.value.trim();
        if (q) Router.go(`/games?q=${encodeURIComponent(q)}`);
      }
    });
    input?.addEventListener('input', debounce(() => {
      const q = input.value.trim();
      if (q.length > 1) Palette.open(q); // live command palette as you type in hero
    }, 350));
  },

  /* ================= GAMES LIBRARY ================= */
  games(params) {
    return { html: `
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Games</h1>
          <div class="sub">Browse the library — every game runs inside the Schooless player.</div>
        </div>
        <span class="tag tag-ok"><span class="st-dot st-verified"></span>${Content.games.filter(g => g.status === 'verified').length} verified embeds</span>
      </div>
      <div class="toolbar">
        <div class="search-box">
          ${I.search}
          <input id="gameSearch" type="search" placeholder="Search by name, category, tag or description…" autocomplete="off" value="${esc(params.get('q') || '')}">
          <button class="clear" id="searchClear" style="display:none" title="Clear">${I.x}</button>
        </div>
        <select class="select" id="sortSelect" aria-label="Sort games">
          <option value="default">Sort: Default</option>
          <option value="name">Alphabetical (A–Z)</option>
          <option value="date">Newest first</option>
          <option value="category">By category</option>
        </select>
      </div>
      <div class="chip-row" id="filterChips" style="margin-bottom:var(--sp-4)">
        ${['all', 'popular', 'recent', 'featured', 'multiplayer', 'alphabetical'].map(f =>
          `<button class="chip" data-filter="${f}">${{ all: 'All', popular: 'Popular', recent: 'Recently added', featured: 'Featured', multiplayer: 'Multiplayer', alphabetical: 'Alphabetical' }[f]}</button>`).join('')}
      </div>
      <div class="chip-row" id="catChips" style="margin-bottom:var(--sp-5)">
        ${['All', ...CATEGORIES.map(c => c.name)].map(c =>
          `<button class="chip ${c === 'All' ? 'active' : ''}" data-category="${esc(c)}">${esc(c)}</button>`).join('')}
      </div>
      <div id="gamesCount" style="color:var(--muted); font-size:12.5px; margin-bottom:var(--sp-3)"></div>
      <div class="game-grid" id="gamesGrid"></div>
      <div id="gamesEmpty"></div>
    </div>`,
    bind: () => Pages.bindGames(params) };
  },

  bindGames(params) {
    const grid = $('#gamesGrid'), count = $('#gamesCount'), emptyBox = $('#gamesEmpty');
    const search = $('#gameSearch'), clearBtn = $('#searchClear'), sortSel = $('#sortSelect');
    let filter = params.get('filter') || 'all';
    let category = params.get('category') || 'All';
    let sort = 'default';
    if (filter === 'alphabetical') { sort = 'name'; filter = 'all'; }
    if (filter === 'recent') { sort = 'date'; filter = 'all'; }
    sortSel.value = sort;

    // reflect initial filter chip
    $$('[data-filter]').forEach(c => c.classList.toggle('active', c.getAttribute('data-filter') === filter));

    const q = () => (search.value || '').trim().toLowerCase();

    function apply() {
      let list = [...Content.games];
      const query = q();
      if (query) {
        list = list.filter(g =>
          g.title.toLowerCase().includes(query) ||
          g.category.toLowerCase().includes(query) ||
          (g.description || '').toLowerCase().includes(query) ||
          (g.tags || []).some(t => t.toLowerCase().includes(query)));
      }
      if (filter === 'popular') list = list.filter(g => g.popular);
      if (filter === 'featured') list = list.filter(g => g.featured);
      if (filter === 'multiplayer') list = list.filter(g => g.category === 'Multiplayer' || (g.tags || []).some(t => t.toLowerCase().includes('multiplayer')));
      if (filter === 'recent') list = list.filter(g => g.dateAdded && g.dateAdded.startsWith('2026'));
      if (category !== 'All') list = list.filter(g => g.category === category);
      if (sort === 'name') list.sort((a, b) => a.title.localeCompare(b.title));
      if (sort === 'date') list.sort((a, b) => (b.dateAdded || '').localeCompare(a.dateAdded || ''));
      if (sort === 'category') list.sort((a, b) => a.category.localeCompare(b.category) || a.title.localeCompare(b.title));

      count.textContent = `${list.length} game${list.length === 1 ? '' : 's'}${query ? ` matching “${query}”` : ''}`;
      clearBtn.style.display = search.value ? '' : 'none';
      grid.innerHTML = list.slice(0, 60).map(g => UI.gameCard(g)).join('');
      if (list.length > 60) count.textContent += ' · showing first 60 — refine your search';
      emptyBox.innerHTML = list.length ? '' : UI.empty('search', 'No games found', 'Try different keywords, or clear the filters.', `<button class="btn btn-ghost btn-sm" id="resetFilters">${I.eraser} Reset filters</button>`);
      $('#resetFilters')?.addEventListener('click', () => {
        search.value = ''; filter = 'all'; category = 'All'; sort = 'default'; sortSel.value = 'default';
        $$('[data-filter]').forEach(c => c.classList.toggle('active', c.getAttribute('data-filter') === 'all'));
        $$('[data-category]').forEach(c => c.classList.toggle('active', c.getAttribute('data-category') === 'All'));
        apply();
      });
    }

    search?.addEventListener('input', debounce(apply, 120));
    clearBtn?.addEventListener('click', () => { search.value = ''; apply(); search.focus(); });
    sortSel?.addEventListener('change', () => { sort = sortSel.value; apply(); });
    $$('[data-filter]').forEach(c => c.addEventListener('click', () => {
      filter = c.getAttribute('data-filter');
      $$('[data-filter]').forEach(x => x.classList.toggle('active', x === c));
      apply();
    }));
    $$('[data-category]').forEach(c => c.addEventListener('click', () => {
      category = c.getAttribute('data-category');
      $$('[data-category]').forEach(x => x.classList.toggle('active', x === c));
      apply();
    }));
    apply();
  },

  /* ================= GAME PLAYER PAGE ================= */
  game(id) {
    const g = Content.games.find(x => x.id === id);
    if (!g) return `<div class="container">${UI.empty('search', 'Game not found', 'This game may have been removed.', `<a class="btn btn-primary" href="#/games">${I.arrowLeft} Back to Games</a>`)}</div>`;
    return { html: Player.gamePlayer(g), bind: () => Player.bindGame(g) };
  },

  /* ================= WEB EXPERIENCES ================= */
  experiences() {
    return { html: `
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Web Experiences</h1>
          <div class="sub">Websites that run inside Schooless — every entry below was verified to allow embedding. No proxies, no tricks.</div>
        </div>
        <span class="tag tag-ok"><span class="st-dot st-verified"></span>${Content.experiences.length} verified sites</span>
      </div>
      <div class="toolbar">
        <div class="search-box">
          ${I.search}
          <input id="expSearch" type="search" placeholder="Search experiences…" autocomplete="off">
        </div>
        <div class="chip-row">
          ${['All', ...new Set(Content.experiences.map(e => e.category))].map(c =>
            `<button class="chip ${c === 'All' ? 'active' : ''}" data-expcat="${esc(c)}">${esc(c)}</button>`).join('')}
        </div>
      </div>
      <div class="privacy-note">
        ${I.shield}
        <div><b>Sandboxed viewer.</b> Sites open in a restricted iframe on an allowlist. Schooless never injects scripts into third-party sites and cannot access their accounts. Each site follows its own privacy policy.</div>
      </div>
      <div class="res-grid" id="expGrid"></div>
      <div id="expEmpty"></div>
    </div>`,
    bind: () => {
      const grid = $('#expGrid'), emptyBox = $('#expEmpty'), search = $('#expSearch');
      let cat = 'All';
      const apply = () => {
        const q = (search.value || '').trim().toLowerCase();
        let list = Content.experiences;
        if (cat !== 'All') list = list.filter(e => e.category === cat);
        if (q) list = list.filter(e => e.name.toLowerCase().includes(q) || e.description.toLowerCase().includes(q) || (e.tags || []).some(t => t.toLowerCase().includes(q)));
        grid.innerHTML = list.map(e => UI.resourceCard(e, 'experience')).join('');
        emptyBox.innerHTML = list.length ? '' : UI.empty('globe', 'No experiences found', 'Try another search term.');
      };
      search?.addEventListener('input', debounce(apply, 120));
      $$('[data-expcat]').forEach(c => c.addEventListener('click', () => {
        cat = c.getAttribute('data-expcat');
        $$('[data-expcat]').forEach(x => x.classList.toggle('active', x === c));
        apply();
      }));
      apply();
    } };
  },

  /* viewer route */
  viewer(params) {
    const url = safeUrl(params.get('u'));
    const name = params.get('n') || domainOf(url || '');
    if (!url) return { html: `<div class="container" style="padding-top:60px">${UI.empty('alert', 'Invalid URL', 'Only HTTPS links from the allowlist can be opened in the viewer.', `<a class="btn btn-ghost btn-sm" href="\x23/experiences">${I.arrowLeft} Back to Web Experiences</a>`)}</div>` };
    return { html: Player.viewer(url, name), bind: () => Player.bindViewer(url) };
  },

  /* ================= RESOURCES ================= */
  resources() {
    return { html: `
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Resources</h1>
          <div class="sub">The full Schooless directory — gaming sites, study fronts and proxy variants, with live embed status.</div>
        </div>
        <span class="tag">${Content.resources.length} resources</span>
      </div>
      <div class="toolbar">
        <div class="search-box">
          ${I.search}
          <input id="resSearch" type="search" placeholder="Search resources…" autocomplete="off">
        </div>
        <select class="select" id="resSort" aria-label="Sort resources">
          <option value="default">Sort: Default</option>
          <option value="name">Name (A–Z)</option>
          <option value="status">By status</option>
          <option value="type">By type</option>
        </select>
      </div>
      <div class="chip-row" style="margin-bottom:var(--sp-5)">
        ${['All', 'Gaming', 'Proxy', 'Tools'].map(t => `<button class="chip ${t === 'All' ? 'active' : ''}" data-restype="${t}">${t}</button>`).join('')}
      </div>
      <div class="res-grid" id="resGrid"></div>
      <div id="resEmpty"></div>
    </div>`,
    bind: () => {
      const grid = $('#resGrid'), emptyBox = $('#resEmpty'), search = $('#resSearch'), sortSel = $('#resSort');
      let type = 'All', sort = 'default';
      const apply = () => {
        const q = (search.value || '').trim().toLowerCase();
        let list = [...Content.resources];
        if (type !== 'All') list = list.filter(r => (r.type || 'gaming').toLowerCase() === type.toLowerCase());
        if (q) list = list.filter(r => r.name.toLowerCase().includes(q) || r.description.toLowerCase().includes(q) || domainOf(r.url).includes(q) || (r.tags || []).some(t => t.toLowerCase().includes(q)));
        if (sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
        if (sort === 'status') list.sort((a, b) => (a.status || '').localeCompare(b.status || ''));
        if (sort === 'type') list.sort((a, b) => (a.type || '').localeCompare(b.type || ''));
        grid.innerHTML = list.map(r => UI.resourceCard(r)).join('');
        emptyBox.innerHTML = list.length ? '' : UI.empty('link', 'No resources found', 'Try a different search or filter.');
      };
      search?.addEventListener('input', debounce(apply, 120));
      sortSel?.addEventListener('change', () => { sort = sortSel.value; apply(); });
      $$('[data-restype]').forEach(c => c.addEventListener('click', () => {
        type = c.getAttribute('data-restype');
        $$('[data-restype]').forEach(x => x.classList.toggle('active', x === c));
        apply();
      }));
      apply();
    } };
  },

  /* ================= PROXIES ================= */
  proxies() {
    const list = Content.resources.filter(r => r.type === 'proxy' || (r.tags || []).some(t => t.toLowerCase() === 'proxy'));
    return { html: `
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Proxies</h1>
          <div class="sub">An informational directory of the proxy resources supplied with Schooless. Availability is not guaranteed and is not verified continuously.</div>
        </div>
        <span class="tag">${list.length} entries</span>
      </div>
      <div class="privacy-note">
        ${I.shield}
        <div><b>Privacy notice.</b> These are independent third-party services with their own privacy practices, logging policies and operators. Schooless links to them but does not operate, control or audit them. Avoid entering passwords or personal accounts through any proxy, and follow your school's or workplace's network policy.</div>
      </div>
      <div class="toolbar">
        <div class="search-box">
          ${I.search}
          <input id="proxySearch" type="search" placeholder="Search proxies…" autocomplete="off">
        </div>
        <select class="select" id="proxySort">
          <option value="default">Sort: Default</option>
          <option value="name">Name (A–Z)</option>
          <option value="status">By status</option>
        </select>
      </div>
      <div class="res-grid" id="proxyGrid"></div>
      <div id="proxyEmpty"></div>
    </div>`,
    bind: () => {
      const grid = $('#proxyGrid'), emptyBox = $('#proxyEmpty'), search = $('#proxySearch'), sortSel = $('#proxySort');
      const apply = () => {
        const q = (search.value || '').trim().toLowerCase();
        let list = Content.resources.filter(r => r.type === 'proxy');
        if (q) list = list.filter(r => r.name.toLowerCase().includes(q) || r.description.toLowerCase().includes(q) || domainOf(r.url).includes(q));
        if (sortSel.value === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
        if (sortSel.value === 'status') list.sort((a, b) => (a.status || '').localeCompare(b.status || ''));
        grid.innerHTML = list.map(r => UI.resourceCard(r)).join('');
        emptyBox.innerHTML = list.length ? '' : UI.empty('globe', 'No proxies found', 'Try a different search.');
      };
      search?.addEventListener('input', debounce(apply, 120));
      sortSel?.addEventListener('change', apply);
      apply();
    } };
  },

  /* ================= RECENTLY ADDED ================= */
  recent() {
    const games = [...Content.games].sort((a, b) => (b.dateAdded || '').localeCompare(a.dateAdded || '')).slice(0, 24);
    const exps = Content.experiences.slice(0, 6);
    const res = Content.resources.filter(r => r.status === 'verified').slice(0, 6);
    return { html: `
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Recently Added</h1>
          <div class="sub">The newest games and resources in Schooless.</div>
        </div>
      </div>

        ${UI.sectionHead('New games', games.length)}

      </section>

        ${UI.sectionHead('New web experiences', exps.length)}

      <section class="section">
        ${UI.sectionHead('New resources', res.length)}

  favorites() {
    return { html: `

      <div class="page-head">
        <div>
          <h1>Favorites</h1>
          <div class="sub">Everything you starred — games, resources and web experiences, saved on this device.</div>
        </div>

      </div>
      <div class="toolbar">
        <div class="search-box">
          ${I.search}

        </div>
      </div>
      <div id="favBody"></div>
    </div>`,
    bind: () => {
      const body = $('#favBody'), search = $('#favSearch');
      const render = () => {

        const games = Content.games.filter(g => Favorites.has('game', g.id) && match(g.title, g.description));
        const exps = Content.experiences.filter(e => Favorites.has('experience', e.id) && match(e.name, e.description));
        const res = Content.resources.filter(r => Favorites.has('resource', r.id) && match(r.name, r.description));
        $('#favCount').textContent = `${games.length + exps.length + res.length} saved`;
        let html = '';
        if (games.length) html += `<section class="section">${UI.sectionHead('Games', games.length)}<div class="game-grid">${games.map(g => UI.gameCard(g)).join('')}</div></section>`;
        if (exps.length) html += `<section class="section">${UI.sectionHead('Web experiences', exps.length)}<div class="res-grid">${exps.map(e => UI.resourceCard(e, 'experience')).join('')}</div></section>`;
        if (res.length) html += `<section class="section">${UI.sectionHead('Resources', res.length)}<div class="res-grid">${res.map(r => UI.resourceCard(r)).join('')}</div></section>`;
        body.innerHTML = html || UI.empty('heart', 'No favorites yet', 'Tap the heart on any game, resource or web experience to keep it here.', `<a class="btn btn-primary" href="#/games">${I.gamepad} Browse Games</a>`);
      };
      search?.addEventListener('input', debounce(render, 120));
      Favorites.onChange(render);

  /* ================= SETTINGS ================= */
  settings() {

    return { html: `

        <div>

          <div class="sub">Personalize Schooless. Every change applies instantly and is saved on this device.</div>
        </div>
      </div>
      <div class="settings-grid">
        <div class="settings-card">

          <div class="opt-row" data-setting="theme">

            <button class="opt-pill ${s.theme === 'light' ? 'active' : ''}" data-value="light">${I.sun} Light</button>

            <button class="opt-pill ${s.accent === 'purple' ? 'active' : ''}" data-value="purple">${swatch('purple', '#A99AFB')} Purple</button>
            <button class="opt-pill ${s.accent === 'green' ? 'active' : ''}" data-value="green">${swatch('green', '#5FBF8F')} Green</button>
            <button class="opt-pill ${s.accent === 'orange' ? 'active' : ''}" data-value="orange">${swatch('orange', '#F0955E')} Orange</button>
            <button class="opt-pill ${s.accent === 'pink' ? 'active' : ''}" data-value="pink">${swatch('pink', '#EF8BB8')} Pink</button>
            <button class="opt-pill ${s.accent === 'neutral' ? 'active' : ''}" data-value="neutral">${swatch('neutral', '#A1A5AE')} Neutral</button>
          </div>
        </div>
        <div class="settings-card">
          <h3>${I.grid} Interface density</h3>
          <p class="sc-sub">Controls spacing and compactness of the whole interface.</p>
          <div class="opt-row" data-setting="density">
            <button class="opt-pill ${s.density === 'compact' ? 'active' : ''}" data-value="compact">Compact</button>
            <button class="opt-pill ${s.density === 'standard' ? 'active' : ''}" data-value="standard">Standard</button>
            <button class="opt-pill ${s.density === 'comfortable' ? 'active' : ''}" data-value="comfortable">Comfortable</button>
          </div>
        </div>
        <div class="settings-card">
          <h3>${I.image} Game cards</h3>
          <p class="sc-sub">Thumbnail size on game cards.</p>
          <div class="opt-row" data-setting="cardsize">
            <button class="opt-pill ${s.cardsize === 'compact' ? 'active' : ''}" data-value="compact">Compact</button>
            <button class="opt-pill ${s.cardsize === 'standard' ? 'active' : ''}" data-value="standard">Standard</button>
            <button class="opt-pill ${s.cardsize === 'large' ? 'active' : ''}" data-value="large">Large thumbnails</button>
          </div>
        </div>
        <div class="settings-card">
          <h3>${I.zap} Animations</h3>
          <p class="sc-sub">Reduce or disable motion — transitions, hovers, page fades.</p>
          <div class="opt-row" data-setting="motion">
            <button class="opt-pill ${s.motion === 'normal' ? 'active' : ''}" data-value="normal">Normal</button>
            <button class="opt-pill ${s.motion === 'reduced' ? 'active' : ''}" data-value="reduced">Reduced</button>
            <button class="opt-pill ${s.motion === 'disabled' ? 'active' : ''}" data-value="disabled">Disabled</button>
          </div>
        </div>
        <div class="settings-card">
          <h3>${I.heart} Data &amp; privacy</h3>
          <p class="sc-sub">Favorites and history live only in this browser's local storage.</p>
          <div class="setting-row">
            <div class="sr-info"><div class="sr-title">Remember favorites</div><div class="sr-sub">Keep starred items between visits</div></div>
            <label class="switch"><input type="checkbox" data-toggle="rememberFavorites" ${s.rememberFavorites ? 'checked' : ''}><span class="track"></span><span class="thumb"></span></label>
          </div>
          <div class="setting-row">
            <div class="sr-info"><div class="sr-title">Remember recently played</div><div class="sr-sub">Track the last ${Recent.MAX} games you opened</div></div>
            <label class="switch"><input type="checkbox" data-toggle="rememberRecent" ${s.rememberRecent ? 'checked' : ''}><span class="track"></span><span class="thumb"></span></label>
          </div>
          <div class="setting-row">
            <div class="sr-info"><div class="sr-title">Clear recent history</div><div class="sr-sub">Remove all recently-played entries</div></div>
            <button class="btn btn-sm btn-danger" id="clearRecentBtn">${I.trash} Clear</button>
          </div>
          <div class="setting-row">
            <div class="sr-info"><div class="sr-title">Reset settings</div><div class="sr-sub">Restore defaults (theme, accent, density…)</div></div>
            <button class="btn btn-sm btn-danger" id="resetSettingsBtn">${I.refresh} Reset</button>
          </div>
        </div>
      </div>
    </div>`,
    bind: () => {
      // option pills
      $$('[data-setting]').forEach(row => {
        row.querySelectorAll('.opt-pill').forEach(btn => btn.addEventListener('click', () => {
          const key = row.getAttribute('data-setting');
          const value = btn.getAttribute('data-value');
          Settings.set(key, value);
          row.querySelectorAll('.opt-pill').forEach(b => b.classList.toggle('active', b === btn));
          Toast.show('ok', 'Applied', `${key}: ${value}`);
        }));
      });
      // toggles
      $$('[data-toggle]').forEach(t => t.addEventListener('change', () => {
        const key = t.getAttribute('data-toggle');
        const value = t.checked;
        if (key === 'rememberFavorites' && !value) {
          // keep favorites data but stop persisting? per spec: "Remember favorites" toggle
          Settings.set(key, value);
        } else Settings.set(key, value);
        Toast.show('ok', 'Saved', `${key}: ${value ? 'on' : 'off'}`);
      }));
      $('#clearRecentBtn')?.addEventListener('click', () => { Recent.clear(); Toast.show('ok', 'History cleared', 'Recently played list is now empty.'); });
      $('#resetSettingsBtn')?.addEventListener('click', () => {
        Settings.data = { ...Settings.defaults };
        Settings.save();
        Toast.show('ok', 'Settings reset', 'Defaults restored.');
        setTimeout(() => Router.handle(), 60);
      });
    } };
  },
};

<script>
/* SCHOOLess — global command palette (Ctrl+K) with keyboard navigation.
 */
'use strict';

const Palette = {
  el: null, input: null, listEl: null,
  items: [], selected: 0, open: false,

  build() {
    if (this.el) return;
    const wrap = document.createElement('div');
    wrap.className = 'palette-backdrop';
    wrap.id = 'palette';
    wrap.innerHTML = `
      <div class="palette" role="dialog" aria-modal="true" aria-label="Global search">
        <div class="palette-input-row">
          ${I.search}
          <input id="paletteInput" type="text" placeholder="Search games, resources, pages…" autocomplete="off" spellcheck="false">
          <kbd>ESC</kbd>
        </div>
        <div class="palette-results" id="paletteResults"></div>
        <div class="palette-foot">
          <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
          <span><kbd>↵</kbd> open</span>
          <span><kbd>esc</kbd> close</span>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    this.el = wrap;
    this.input = $('#paletteInput');
    this.listEl = $('#paletteResults');

    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) this.close(); });
    this.input.addEventListener('input', debounce(() => this.search(this.input.value), 90));
    this.input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); this.move(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.move(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); this.openSelected(); }
      else if (e.key === 'Escape') { e.preventDefault(); this.close(); }
    });
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        this.isOpen() ? this.close() : this.open();
      }
      if (e.key === 'Escape' && this.isOpen()) this.close();
    });
    this.search('');
  },

  isOpen() { return this.el?.classList.contains('open'); },

  open(prefill = '') {
    this.build();
    this.el.classList.add('open');
    this.input.value = prefill;
    this.search(prefill);
    setTimeout(() => this.input.focus(), 30);
  },

  close() { this.el?.classList.remove('open'); },

  move(d) {
    if (!this.items.length) return;
    this.selected = (this.selected + d + this.items.length) % this.items.length;
    // update highlight in place (do NOT re-run search — it resets selection)
    this.listEl.querySelectorAll('.palette-item').forEach(el => {
      el.classList.toggle('selected', +el.getAttribute('data-idx') === this.selected);
    });
    const sel = this.listEl.querySelector('.palette-item.selected');
    sel?.scrollIntoView({ block: 'nearest' });
  },

  openSelected() {
    const it = this.items[this.selected];
    if (!it) return;
    this.close();
    if (it.external) window.open(it.url, '_blank', 'noopener,noreferrer');
    else if (it.action) it.action();
    else Router.go(it.route);
  },

  search(q) {
    q = (q || '').trim().toLowerCase();
    const results = [];

    // pages
    const pages = [
      { title: 'Home', sub: 'Homepage', route: '/', icon: 'home' },
      { title: 'Games', sub: 'Game library', route: '/games', icon: 'gamepad' },
      { title: 'Proxies', sub: 'Proxy directory', route: '/proxies', icon: 'globe' },
      { title: 'Resources', sub: 'Resource directory', route: '/resources', icon: 'book' },
      { title: 'Web Experiences', sub: 'Embedded websites', route: '/experiences', icon: 'sparkles' },
      { title: 'Recently Added', sub: 'Newest content', route: '/recent', icon: 'clock' },
      { title: 'Favorites', sub: 'Your starred items', route: '/favorites', icon: 'heart' },
      { title: 'Settings', sub: 'Themes, accents, density', route: '/settings', icon: 'settings' },
    ];
    const pageHits = pages.filter(p => !q || p.title.toLowerCase().includes(q) || p.sub.toLowerCase().includes(q));
    if (pageHits.length) results.push({ group: 'Pages', items: pageHits });

    // categories
    if (q) {
      const cats = CATEGORIES.filter(c => c.name.toLowerCase().includes(q)).map(c => ({
        title: c.name, sub: 'Category', route: `/games?category=${encodeURIComponent(c.name)}`, icon: c.icon,
      }));
      if (cats.length) results.push({ group: 'Categories', items: cats.slice(0, 4) });
    }

    // games
    const games = Content.games.filter(g =>
      !q || g.title.toLowerCase().includes(q) || g.category.toLowerCase().includes(q) ||
      (g.tags || []).some(t => t.toLowerCase().includes(q)) || (g.description || '').toLowerCase().includes(q)
    ).slice(0, q ? 8 : 5);
    if (games.length) results.push({
      group: 'Games',
      items: games.map(g => ({ title: g.title, sub: `${g.category} · ${g.source || 'js13k'}`, route: `/game/${g.id}`, icon: 'play' })),
    });

    // experiences
    const exps = Content.experiences.filter(e => !q || e.name.toLowerCase().includes(q) || e.description.toLowerCase().includes(q)).slice(0, 4);
    if (exps.length) results.push({
      group: 'Web Experiences',
      items: exps.map(e => ({ title: e.name, sub: e.category, route: `/view?u=${encodeURIComponent(e.url)}&n=${encodeURIComponent(e.name)}`, icon: 'globe' })),
    });

    // resources (gaming + proxy + tools)
    const res = Content.resources.filter(r => !q || r.name.toLowerCase().includes(q) || r.description.toLowerCase().includes(q) || domainOf(r.url).includes(q)).slice(0, 5);
    if (res.length) results.push({
      group: 'Resources',
      items: res.map(r => ({ title: r.name, sub: r.type === 'proxy' ? 'Proxy · opens externally' : r.type === 'tools' ? 'Tool resource · opens externally' : 'Gaming resource · opens externally', url: r.url, external: true, icon: 'link' })),
    });

    this.items = results.flatMap(g => g.items);
    this.selected = 0;
    this.render(results, q);
  },

  render(results, q = '') {
    this.lastQ = q;
    if (!this.items.length) {
      this.listEl.innerHTML = `<div class="palette-empty">${I.search}<div>No results for “${esc(q)}”</div><div style="font-size:11.5px; margin-top:3px">Try a game name, category or resource</div></div>`;
      return;
    }
    let idx = 0;
    this.listEl.innerHTML = results.map(g => `
      <div class="palette-group">${esc(g.group)}</div>
      ${g.items.map(it => {
        const sel = idx === this.selected ? 'selected' : '';
        const i = idx; idx++;
        return `<div class="palette-item ${sel}" data-idx="${i}" title="${esc(it.title)}">
          <span class="p-ico">${I[it.icon] || I.link}</span>
          <span class="p-body">
            <span class="p-title">${esc(it.title)}</span>
            <span class="p-sub">${esc(it.sub)}</span>
          </span>
          ${it.external ? `<span class="p-hint">↗</span>` : ''}
        </div>`;
      }).join('')}`).join('');
    this.listEl.querySelectorAll('.palette-item').forEach(el => {
      el.addEventListener('click', () => { this.selected = +el.getAttribute('data-idx'); this.openSelected(); });
      el.addEventListener('mousemove', () => {
        const i = +el.getAttribute('data-idx');
        if (i !== this.selected) { this.selected = i; this.listEl.querySelectorAll('.palette-item').forEach(x => x.classList.toggle('selected', +x.getAttribute('data-idx') === i)); }
      });
    });
  },
};

</script>
<script>
/* SCHOOLess — Admin dashboard: auth gate + content management.
 * Client-side gate over localStorage-backed overrides (documented limitation:
 * a static single-file app cannot do server-side auth; the password gate uses a
 * SHA-256 hash, never the plaintext. Swap in a real backend for production.)
 */
'use strict';

const Admin = {
  loginView() {
    return { html: `
    <div class="admin-login">
      <div class="al-card">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px">
          <span class="logo-mark" style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#6D5BE0);color:#fff">${I.logo.replace('viewBox="0 0 32 32"', 'viewBox="0 0 32 32" width="20" height="20"')}</span>
          <div><h2>Admin access</h2></div>
        </div>
        <p>Sign in to manage games, resources and embed settings. This demo gate uses a local password hash — see the README for replacing it with a real backend.</p>
        <form id="adminLoginForm">
          <div class="field" id="pwField">
            <label for="adminPw">Password</label>
            <input id="adminPw" type="password" placeholder="Enter admin password" autocomplete="current-password">
            <div class="f-err" id="pwErr">Incorrect password.</div>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%">${I.key} Unlock dashboard</button>
        </form>
        <div style="margin-top:14px; font-size:11.5px; color:var(--muted); display:flex; gap:6px; align-items:flex-start">
          ${I.info}<span>Demo password: <code style="font-family:var(--mono)">schooless-admin</code> — change it in the build config before deploying.</span>
        </div>
      </div>
    </div>`,
    bind: () => {
      $('#adminLoginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = $('#adminPw').value;
        const ok = await Auth.login(pw);
        if (ok) { Toast.show('ok', 'Welcome back', 'Admin dashboard unlocked.'); Router.handle(); }
        else {
          $('#pwField').classList.add('invalid');
          $('#adminPw').value = '';
          setTimeout(() => $('#pwField')?.classList.remove('invalid'), 1800);
        }
      });
    } };
  },

  dashboard() {
    const reports = Store.get('reports', []);
    return { html: `
    <div class="container" style="max-width:1100px">
      <div class="page-head">
        <div>
          <h1>Admin Dashboard</h1>
          <div class="sub">Manage the Schooless content library. Changes are stored on this device and merge over the built-in catalog.</div>
        </div>
        <div style="display:flex; gap:8px">
          <button class="btn btn-sm btn-ghost" id="exportBtn">${I.download} Export</button>
          <button class="btn btn-sm btn-ghost" id="importBtn">${I.upload} Import</button>
          <button class="btn btn-sm btn-danger" id="logoutBtn">${I.x} Log out</button>
        </div>
      </div>

      <div class="admin-tabs" id="adminTabs">
        <button class="admin-tab active" data-tab="games">Games (${Content.games.length})</button>
        <button class="admin-tab" data-tab="resources">Resources (${Content.resources.length})</button>
        <button class="admin-tab" data-tab="experiences">Experiences (${Content.experiences.length})</button>
        <button class="admin-tab" data-tab="sources">Sources (${Content.sources.length})</button>
        <button class="admin-tab" data-tab="reports">Reports (${reports.length})</button>
      </div>

      <div id="adminBody"></div>
    </div>`,
    bind: () => {
      let tab = 'games';
      const body = $('#adminBody');
      const render = () => { body.innerHTML = Admin[`tab_${tab}`](); Admin[`bind_${tab}`]?.(); };
      $$('.admin-tab').forEach(t => t.addEventListener('click', () => {
        tab = t.getAttribute('data-tab');
        $$('.admin-tab').forEach(x => x.classList.toggle('active', x === t));
        render();
      }));
      $('#logoutBtn')?.addEventListener('click', () => { Auth.logout(); Toast.show('info', 'Logged out', ''); Router.go('/'); });
      $('#exportBtn')?.addEventListener('click', () => {
        const data = JSON.stringify(Content.exportAll(), null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'schooless-content.json';
        a.click();
        URL.revokeObjectURL(a.href);
        Toast.show('ok', 'Exported', 'schooless-content.json downloaded.');
      });
      $('#importBtn')?.addEventListener('click', () => {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'application/json';
        inp.onchange = () => {
          const file = inp.files[0];
          if (!file) return;
          const rd = new FileReader();
          rd.onload = () => {
            try {
              const data = JSON.parse(rd.result);
              if (data.overrides) { Store.set(Content.KEY, data.overrides); Content.overrides = data.overrides; Content.rebuild(); }
              Toast.show('ok', 'Imported', 'Content overrides replaced.');
              Router.handle();
            } catch { Toast.show('err', 'Import failed', 'That file is not valid JSON.'); }
          };
          rd.readAsText(file);
        };
        inp.click();
      });
      render();
    } };
  },

  /* ---------- tab: games ---------- */
  tab_games() {
    return `
    <div style="display:flex; justify-content:flex-end; margin-bottom:var(--sp-3)">

/* ============ Modal (shared) ============ */
const Modal = {
  build() {
    if ($('#modalRoot')) return;
    const root = document.createElement('div');
    root.className = 'modal-backdrop';
    root.id = 'modalRoot';
    root.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" id="modalClose" aria-label="Close">${I.x}</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>`;
    document.body.appendChild(root);
    root.addEventListener('mousedown', (e) => { if (e.target === root) this.close(); });
    $('#modalClose').addEventListener('click', () => this.close());
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && root.classList.contains('open')) this.close(); });
    root.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) this.close(); });
  },
  show(title, bodyHtml, footHtml = '') {
    this.build();
    $('#modalTitle').innerHTML = title;
    $('#modalBody').innerHTML = bodyHtml;
    $('#modalFoot').innerHTML = footHtml;
    $('#modalRoot').classList.add('open');
  },
  close() { $('#modalRoot')?.classList.remove('open'); },
};

      <a href="#/resources">${I.book} Resources</a>
      <a href="#/recent">${I.clock} Recently Added</a>
      <a href="#/experiences">${I.sparkles} Web Experiences</a>
      <a href="#/favorites">${I.heart} Favorites</a>
      <a href="#/settings">${I.settings} Settings</a>
    </div>`;
  },

  footer() {
    return `
    <footer class="footer">
      <div class="footer-inner">
        <div class="f-brand">
          <a class="brand" href="#/">
            <span class="logo-mark">${I.logo}</span>
            <span><b>SCHOOLess</b></span>
          </a>
          <p>Your gateway to everything — games, web experiences and useful resources in one clean place. Favorites and settings stay on your device.</p>
        </div>
        <div class="f-cols">
          <div class="f-col">
            <h4>Explore</h4>
            <a href="#/games">Games</a>
            <a href="#/experiences">Web Experiences</a>
            <a href="#/recent">Recently Added</a>
            <a href="#/favorites">Favorites</a>
          </div>
          <div class="f-col">
            <h4>Directories</h4>
            <a href="#/resources">Resources</a>
            <a href="#/proxies">Proxies</a>
            <a href="#/settings">Settings</a>
          </div>
        </div>
      </div>
      <div class="f-bottom">
        <span>© ${new Date().getFullYear()} SCHOOLess · Embedded sources belong to their owners.</span>
        <span class="ext-note">${I.shield} Third-party sites have their own privacy practices.</span>
      </div>
    </footer>`;
  },

  boot(builtinGames, adminHash) {
    // settings first (applies theme before first paint of dynamic content)
    Settings.load();
    Settings.onChange(() => this.syncFavBadge());

    Favorites.load();
    Recent.load();
    Content.load({ games: builtinGames, resources: RESOURCES, experiences: EXPERIENCES, sources: SOURCES });
    Auth.init(adminHash);

    // shell
    $('#navRoot').innerHTML = this.navbar();
    $('#footerRoot').innerHTML = this.footer();

    // nav actions
    $('#navSearch').addEventListener('click', () => Palette.open());
    $('#menuBtn').addEventListener('click', () => $('#mobileMenu').classList.toggle('open'));
    this.syncFavBadge();
    Favorites.onChange(() => this.syncFavBadge());
    Recent.onChange(() => this.syncFavBadge());

    // follow system theme changes live
    window.matchMedia?.('(prefers-color-scheme: light)').addEventListener?.('change', () => {
      if (Settings.data.theme === 'system') Settings.apply();
    });

    // routes
    Router.register(/^\/$/, () => this.mount(Pages.home(), () => Pages.bindHome()));
    Router.register(/^\/games$/, (m, params) => { const v = Pages.games(params); this.mount(v.html, v.bind); });
    Router.register(/^\/game\/([\w.-]+)$/, (m) => { const v = Pages.game(m[1]); this.mount(v.html, v.bind); });
    Router.register(/^\/experiences$/, () => { const v = Pages.experiences(); this.mount(v.html, v.bind); });
    Router.register(/^\/view$/, (m, params) => { const v = Pages.viewer(params); this.mount(v.html, v.bind); });
    Router.register(/^\/resources$/, () => { const v = Pages.resources(); this.mount(v.html, v.bind); });
    Router.register(/^\/proxies$/, () => { const v = Pages.proxies(); this.mount(v.html, v.bind); });
    Router.register(/^\/recent$/, () => this.mount(Pages.recent().html));
    Router.register(/^\/favorites$/, () => { const v = Pages.favorites(); this.mount(v.html, v.bind); });
    Router.register(/^\/settings$/, () => { const v = Pages.settings(); this.mount(v.html, v.bind); });
    Router.register(/^\/admin$/, () => {
      const v = Auth.isAuthed() ? Admin.dashboard() : Admin.loginView();
      this.mount(v.html, v.bind);
    });

    Router.handle();
  },

  syncFavBadge() {
    const btn = $('#navFav');
    if (!btn) return;
    const n = Favorites.count();
    const old = btn.querySelector('.badge-count');
    old?.remove();
    if (n > 0) {
      const b = document.createElement('span');
      b.className = 'badge-count';
      b.textContent = n > 99 ? '99+' : n;
      btn.appendChild(b);
    }
  },
};

App.boot(BUILTIN_GAMES, ADMIN_HASH);
</script>
</body>
</html>
